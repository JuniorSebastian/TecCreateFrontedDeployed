<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="TecCreate - Crea presentaciones educativas en 5 minutos con IA para TECSUP Lima"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>TecCreate - Presentaciones IA TECSUP</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Error overlay helper: muestra errores no capturados en producción para evitar pantalla en blanco -->
    <script>
      (function(){
        function showOverlay(message, stack) {
          try {
            var existing = document.getElementById('error-overlay');
            if (existing) existing.remove();
            var overlay = document.createElement('div');
            overlay.id = 'error-overlay';
            overlay.style.position = 'fixed';
            overlay.style.left = 0;
            overlay.style.top = 0;
            overlay.style.right = 0;
            overlay.style.bottom = 0;
            overlay.style.background = 'rgba(0,0,0,0.7)';
            overlay.style.color = '#fff';
            overlay.style.zIndex = 999999;
            overlay.style.padding = '24px';
            overlay.style.fontFamily = 'Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial';
            overlay.innerHTML = '<div style="max-width:900px;margin:40px auto;background:#111827;padding:20px;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.6)">' +
              '<h2 style="margin:0 0 8px;font-size:18px">Error en la aplicación</h2>' +
              '<pre style="white-space:pre-wrap;color:#fefefe;font-size:13px;line-height:1.3;max-height:60vh;overflow:auto">' +
              (message || 'Error desconocido') + '\n' + (stack || '') + '</pre>' +
              '<p style="margin-top:12px;color:#93c5fd;font-size:13px">Copia este error y pégalo en el chat para que lo revise.</p>' +
              '<button id="dismiss-error" style="margin-top:12px;padding:8px 12px;border-radius:6px;border:none;background:#3b82f6;color:white;cursor:pointer">Cerrar</button>' +
              '</div>';
            document.body.appendChild(overlay);
            document.getElementById('dismiss-error').onclick = function(){ overlay.remove(); };
          } catch(e) { console.error('No se pudo mostrar overlay de error', e); }
        }

        window.addEventListener('error', function(ev){
          console.error('Captured error', ev.error || ev.message, ev.error && ev.error.stack);
          showOverlay(ev.message || String(ev.error), (ev.error && ev.error.stack) || '');
        });

        window.addEventListener('unhandledrejection', function(ev){
          console.error('Unhandled rejection', ev.reason);
          var msg = (ev.reason && ev.reason.message) ? ev.reason.message : String(ev.reason);
          var stack = ev.reason && ev.reason.stack ? ev.reason.stack : '';
          showOverlay(msg, stack);
        });
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
